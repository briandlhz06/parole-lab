services:
  target:
    build: .
    hostname: vps-lab
    ports:
      - "13306:3306"
      - "16379:6379"
      - "2222:22"
    volumes:
      - ./out:/opt/parole-lab/out
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':3306' && ss -lnt | grep -q ':6379'"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
